# Bookkeepy 1 — gpui-kit component inventory (RULE-UI-006, ADR-0007/0017): the SINGLE
# SOURCE OF TRUTH for "which gpui-kit styled component is demoed where in the gallery".
# `cargo xtask govern ui` cross-checks this file against the gallery's SECTIONS registry
# and the ui crate's widget metadata, so a gpui-kit upgrade updates this inventory +
# gallery sections together or the gate fails.
#
# status: covered  — demoed in a gallery section (see `section`, the registry id from
#                    gallery/src/sections/mod.rs)
#         exception — NOT demoed as a section card, with the mandatory `note` saying why
#                    (feature flags, app-level constructs) and how it is exercised.
#
# Scope: every component page published on https://gpui-kit.com/component/ (fetched
# docs live in the gpui-kit skill references). Source modules WITHOUT a published
# component page (link, separator, highlighter, inspector, history, and the search
# internals behind Select/ComboBox — SearchableListState etc.) are intentionally not
# tracked here: they surface only through the tracked components that compose them.

[source]
