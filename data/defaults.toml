# Bookkeepy 1 — primary data: default/fallback policies (point 2: "we have to provide what
# happens, a default"). SINGLE SOURCE OF TRUTH for what the app does when user data is
# missing or deleted (e.g. deleted manual rates are irrecoverable → this chain applies).

[source]
kind = "bookkeepy-primary-data"
note = "Maintained by the project; schema changes require an ADR."

# FX defaults: fallback chain used when no fx_rates row matches a conversion request.
# Steps are tried in order; the first that yields a rate wins.
[fx_rates]
fallback_chain = [
  "latest live rate from the user's primary source with date <= value date",
  "latest live rate from any source with date <= value date",
  "nearest earlier live rate from the primary source",
  "fail with BK-FX-0002 (user-facing: download rates or enter a manual one)",
]

# What happens when the user deletes manual/adjusted rates: they are NOT recoverable; the
# fallback chain above applies from that moment. The UI warns before deletion.
[fx_rates.manual_deleted]
recoverable = false
behavior = "apply fx_rates.fallback_chain"

# Defaults applied when local system context is missing/cleared (doc 08).
[system_context.defaults]
dpi_scale = 1.0
assume_single_display = true
perf_tier = "medium"

# Job orchestration defaults (RULE-JOB-001, ADR-0015, doc 04 §4.8). Per-job-type overrides
# live next to the job pipeline (adjacent file), this table is the global default (SSOT).
[jobs]
max_attempts = 3
backoff_base_ms = 500
backoff_multiplier = 2.0
jitter = true
# after max_attempts: state=failed, manual retry surfaced to the user (toast + Jobs panel)
surface_manual_retry = true
