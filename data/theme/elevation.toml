# Bookkeepy 1 — primary data: elevation tokens — shadows, z-index layers, focus ring
# (RULE-UI-005/007, RULE-DATA-001/003).
#
# 1:1 with TOKENS · Bookkeepy v1 §06 Elevation, borders & focus: the design is FLAT —
# cards and HUD carry no shadow; only popovers and dialogs float (black @ 60%).
# Referenced by name — never raw blur/offset/z in code.

[source]
kind = "bookkeepy-design-language"
note = "Bookkeepy v1 design language (Penpot 'draft' page, exported under references/designlanguage/). Maintained by the project; schema changes require an ADR."

# Shadows — the only two drawn: popover 0 8 24, dialog 0 16 48, black @ 60%.
[shadow.popover]
blur_px = 24
offset_y_px = 8
offset_x_px = 0
color = "#000000"
opacity = 0.6

[shadow.dialog]
blur_px = 48
offset_y_px = 16
offset_x_px = 0
color = "#000000"
opacity = 0.6

# Z-index (stacking) layers — flat → raised → hud → popover → dialog → toast → tooltip.
[z]
flat     = 0  # in-flow content: shell, sidebar, board
raised   = 10 # cards on the board, sticky notes, dragged places
hud      = 20 # zoom control, minimap, location chip
popover  = 30 # menus, selects, hover cards, popovers
dialog   = 40 # dialogs, alert dialogs, sheets + scrim
toast    = 50 # notifications/toasts
tooltip  = 60 # tooltips, the topmost layer

# Focus ring — ATOMS · 03 / TOKENS §06: "input · focus (ring 2, offset 2)", accent color.
[focus]
ring_width_px = 2
ring_offset_px = 2
color = "$orange-500" # resolves to the accent hue in both modes
