# Bookkeepy 1 — primary data: elevation design tokens — shadows + z-index layers
# (RULE-UI-005/007, RULE-DATA-001/003; "elevation.toml (z-index)").
#
# SSOT for depth: the exact shadows drawn in the design language (pure black at 60% opacity,
# three scale steps) and the stacking order they imply. Referenced by name by gpui-kit styled
# components and gallery variants — never raw blur/offset/z values in code.

[source]
kind = "bookkeepy-design-language"
note = "Bookkeepy v1 design language (Penpot 'draft' page, exported under references/designlanguage/). Maintained by the project; schema changes require an ADR."

# Shadows — exactly as drawn: black flood at 60% opacity, blur + y-offset doubling per step.
[shadow.peek]
blur_px = 6
offset_y_px = 4
offset_x_px = 0
color = "#000000"
opacity = 0.6

[shadow.raised]
blur_px = 12
offset_y_px = 8
offset_x_px = 0
color = "#000000"
opacity = 0.6

[shadow.overlay]
blur_px = 24
offset_y_px = 16
offset_x_px = 0
color = "#000000"
opacity = 0.6

# Z-index (stacking) layers — the composition order of the design sheets; steps of 100
# leave room for insertions between layers.
[z]
base = 0 # in-flow content
sticky = 100 # sticky headers/toolbars, floating action bars
dropdown = 200 # popovers, menus, selects, date pickers, color pickers
overlay = 300 # dialogs, alert dialogs, sheets
toast = 400 # notifications/toasts
tooltip = 500 # tooltips, the topmost layer
