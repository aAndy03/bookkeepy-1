# Bookkeepy 1 — primary data: typography design tokens (RULE-UI-005/007, RULE-DATA-001/003).
#
# SSOT for the type system: font stacks + one named style per text role. Text is always
# rendered through a named style (referenced by gpui-kit styled components and gallery
# variants) — never a raw size/weight in code. Amounts always render tabular (figures stay
# aligned in columns — a bookkeeping invariant).

[source]
kind = "bookkeepy-design-language"
note = "Bookkeepy v1 design language (Penpot 'draft' page, exported under references/designlanguage/). Maintained by the project; schema changes require an ADR."

[font]
# UI family with per-OS fallbacks (first available wins; gpui resolves the stack).
ui = "\"Segoe UI Variable Text\", \"Segoe UI\", \"SF Pro Text\", \"Inter\", system-ui, sans-serif"
# Numeric/monospaced surfaces: code, IDs, hash chains, tabular amounts.
mono = "\"Cascadia Mono\", \"JetBrains Mono\", \"SF Mono\", \"Consolas\", monospace"

# Named text styles. line_height is a unitless multiplier; letter_spacing is px
# (negative = tighter, used on display sizes as drawn in the design sheets).
[[style]]
id = "display"
size_px = 24
weight = 600
line_height = 1.2
letter_spacing_px = -0.4
font = "ui"

[[style]]
id = "title"
size_px = 20
weight = 600
line_height = 1.25
letter_spacing_px = -0.2
font = "ui"

[[style]]
id = "heading"
size_px = 16
weight = 600
line_height = 1.3
letter_spacing_px = -0.1
font = "ui"

[[style]]
id = "subtitle"
size_px = 15
weight = 500
line_height = 1.3
letter_spacing_px = 0.0
font = "ui"

[[style]]
id = "body"
size_px = 13
weight = 400
line_height = 1.45
letter_spacing_px = 0.0
font = "ui"

[[style]]
id = "label"
size_px = 13
weight = 500
line_height = 1.45
letter_spacing_px = 0.0
font = "ui"

[[style]]
id = "caption"
size_px = 12
weight = 400
line_height = 1.35
letter_spacing_px = 0.0
font = "ui"

[[style]]
id = "micro"
size_px = 11
weight = 400
line_height = 1.3
letter_spacing_px = 0.0
font = "ui"

[[style]]
id = "mono"
size_px = 13
weight = 400
line_height = 1.45
letter_spacing_px = 0.0
font = "mono"
tabular = true

# Money amounts in tables/totals: UI family, tabular figures, medium weight.
[[style]]
id = "amount"
size_px = 13
weight = 500
line_height = 1.45
letter_spacing_px = 0.0
font = "ui"
tabular = true
