# Bookkeepy 1 - primary data: supported currencies (ISO 4217, fiat scope).
#
# PRIMARY DATA file (docs/04-conventions.md RULE-DATA-001, ADR-0008): engines/APIs/pipelines import
# this file; no currency list is ever hardcoded in source code.
# Source: official ISO 4217 list published by SIX Group on behalf of ISO.
#   url       = "https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml"
#   published = "2026-09-17"
# Scope: fiat currencies. Supplementary/funds codes that carry no currency name in the
# source list (XAD, BOV, CLF, ...) are omitted - fintecheng: currency codes identify fiat only.
# Regenerate only from the official source; never edit codes or minor units by hand.

