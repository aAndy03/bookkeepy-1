# Bookkeepy 1 — locale catalog: English (en), the reference locale.
# SSOT for user-facing strings (RULE-ERR-002/003, item 8 M0.5). Keys are dotted and quoted so
# they stay flat. `xtask govern errors` fails CI if a key is missing here or in another
# locale, or if an error registry i18n_key has no message. Add new keys here FIRST, then
# translate in the other locales.

