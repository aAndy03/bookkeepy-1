# Bookkeepy 1 — primary data: load policies (point 12, doc 03 "Loading, caching, prefetch").
# SINGLE SOURCE OF TRUTH for what the app loads, when, and what it prefetches. Consumed by
# the `loadpolicy` crate (engine_loadpolicy). Tiers: hot = in-memory, warm = SQLite/tantivy,
# cold = files on disk. INV-LOAD-001: on a cold start the user can add a transaction within
# the budget in perf-budgets.toml.

[source]
kind = "bookkeepy-primary-data"
note = "Maintained by the project; schema changes require an ADR."

[boot_sequence]
# Canonical cold-start order (round-5 item 6; doc 03 "Loading, caching, prefetch").
# Each step is cheap; INV-LOAD-001: the user can add a transaction within budget.
# Steps may fail non-fatally (e.g. no network for rates manifest) — boot never blocks on them.
# `id` is the machine-readable step id — code (e.g. storage::session::BOOT_STEPS) must keep
# its executed order a subsequence of this list; `govern data` + a unit test enforce it.
steps = [
  { id = "single_instance", label = "single-instance check + focus existing window (ADR-0016)" },
  { id = "diagnostics_logging", label = "diagnostics panic hook + local logging init (crates)" },
  { id = "registry", label = "profile registry load; if no profile -> onboarding (F17), never blocked (RULE-UX-001)" },
  { id = "profile_open", label = "profile open: schema_version check (RULE-DATA-004), migrations forward-only" },
  { id = "settings", label = "settings load (defaults from data/settings-defaults.toml + user overrides)" },
  { id = "theme", label = "theme tokens (data/theme/*) applied per settings.theme" },
  { id = "locale", label = "locale applied per settings.language (i18n crate)" },
  { id = "window_restore", label = "window restore from ui_state (size/position/display), else centered on primary display" },
  { id = "accounts_summary", label = "accounts summary (warm tier, balances derived+ cached)" },
  { id = "last_view", label = "last open view + timeline scope restore" },
  { id = "rates_cache", label = "rates manifest cache (local only, no network)" },
  { id = "jobs_resume", label = "resume interrupted jobs (RULE-JOB-001) + crash-recovery draft offer" },
]

[on_app_open]
tier = "hot+warm"
loads = ["ui shell + theme tokens", "settings", "accounts summary (balances derived, cached)", "last open view", "rates manifest cache (no network)"]
never = ["full journal", "all attachments", "all reports", "full search index load"]

[on_navigate]
transactions_list = { tier = "warm", page_size = 50, virtualized = true, prefetch_next_pages = 1 }
account_detail = { tier = "warm", page_size = 50 }
reports = { tier = "warm", computed_on_demand = true, cached = true }
rates_browser = { tier = "warm", query_local_only = true }

[on_idle]
prefetch = ["next page of the current list", "rates manifest re-check if the user enabled periodic sync", "warm tantivy index for the current book", "backup reminder if due"]

[usage_tracking]
enabled = true
scope = "local-only prefetch tuning"
stored_in = "usage_stats table"
visible_in = "Settings -> Privacy -> Data we collect"
clearable = true
