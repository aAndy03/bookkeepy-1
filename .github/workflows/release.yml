# Bookkeepy 1 release workflow — the ONLY event that spends Actions minutes by default
# (plus manual workflow_dispatch of ci.yml). Runs on published and prereleased GitHub
# Releases of aAndy03/bookkeepy-1 (doc 09; wire format: doc 08 "Release wire format v1").
#
# Flow: verify (calls ci.yml: fmt/clippy/test/govern/audit/deny/bench on 3 OSes)
#   -> build release artifacts -> generate manifest.json + SHA256SUMS -> attach to release.
# Real installers (MSI/dmg/deb/AppImage) land with M3/M10 per packaging/README.md; until
# then the release carries the workspace release build + checksums as proof-of-pipeline.
name: release

on:
  release:
    types: [published, prereleased]

permissions:
  contents: write # attach artifacts to the release

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  artifacts:
    name: build + attach release assets
    needs: verify
    runs-on: ubuntu-latest
    environment: release # protects the signing/upload step
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: release build (channel=release, reproducible)
        env:
          BOOKKEEPY_CHANNEL: release # ADR-0021: shipped binaries are always the release channel
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          export SOURCE_DATE_EPOCH=$(date -u -d "$RELEASE_PUBLISHED_AT" +%s) # reproducible builds (build-info honors it)
          cargo build --workspace --release
      - name: third-party licenses + SBOM
        run: |
          cargo install cargo-about cargo-cyclonedx --locked --quiet || true
          cargo xtask licenses || true
          cargo cyclonedx --format json --output-file sbom.cdx.json || true
          ls -la THIRD-PARTY-LICENSES.md sbom.cdx.json 2>/dev/null || true
      - name: generate manifest.json + SHA256SUMS (doc 08 wire format v1)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          ASSET="bookkeepy-1-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "$ASSET" -C target/release xtask
          sha256sum "$ASSET" > SHA256SUMS.tmp
          SHA=$(awk '{print $1}' SHA256SUMS.tmp)
          SIZE=$(stat -c%s "$ASSET")
          cat > manifest.json <<EOF
          {
            "spec": "bookkeepy-release-manifest@1",
            "version": "${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes_url": "https://github.com/aAndy03/bookkeepy-1/releases/tag/${TAG}",
            "assets": [
              { "name": "${ASSET}", "os": "linux", "arch": "x86_64", "kind": "tar.gz",
                "sha256": "${SHA}", "size": ${SIZE} }
            ]
          }
          EOF
          sha256sum manifest.json >> SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
      - name: attach assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" manifest.json SHA256SUMS bookkeepy-1-*-linux-x86_64.tar.gz --clobber
          gh release upload "$TAG" THIRD-PARTY-LICENSES.md sbom.cdx.json --clobber 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            manifest.json
            SHA256SUMS
            bookkeepy-1-*-linux-x86_64.tar.gz
            THIRD-PARTY-LICENSES.md
            sbom.cdx.json
