# Bookkeepy 1 CI — MINUTES-BUDGET POLICY (doc 09, round-3 decision):
# GitHub Actions minutes are spent ONLY on releases/prereleases (via release.yml calling
# this workflow) and on manual `workflow_dispatch` runs of "important" checks.
# Pushes and PRs run ZERO actions — contributors run the identical gate locally instead:
#   cargo xtask check        (fmt --check + clippy -D warnings + tests + governors + bench
#                             sanity + cargo deny check when cargo-deny is installed)
#   cargo xtask hook install (pre-commit: fmt + fast governors + clippy, once per clone)
# Rust version comes from rust-toolchain.toml (1.100.0).
name: ci

on:
  workflow_dispatch: # manual "important" run
  workflow_call: # called by release.yml on published / prereleased releases

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable # rust-toolchain.toml pins 1.100.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: governors
        run: cargo xtask govern

  audit:
    name: audit (rustsec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: deny (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check (licenses, bans, advisories, sources)
        run: cargo deny check
      # cargo-vet gate hardens from M2 (first crate-by-crate `cargo vet certify` pass);
      # until then it is advisory.
      - name: cargo vet (advisory until M2)
        run: cargo vet --locked --output-format human 2>/dev/null || true
        continue-on-error: true

  bench:
    name: bench (sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: benches compile + run once (no measurement)
        run: cargo bench --workspace -- --test
