# cargo-deny config (item 3, M0.5; doc 07/09). Bookkeepy 1 is GPL-3.0-or-later, so only
# GPL-compatible licenses are allowed; AGPL and friends are banned outright.
# `cargo deny check` runs in CI (job `deny`). New deps must pass this before merge.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # the app itself and its direct ecosystem
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-3.0-or-later",
    "LGPL-2.1-or-later",
]
# AGPL would force source disclosure of network services — Bookkeepy is offline-first
# and GPL-3.0-or-later; AGPL deps are banned, not just unlisted.
deny = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "AGPL-1.0-only",
    "AGPL-1.0-or-later",
    "SSPL-1.0",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true # private workspace crates are all GPL-3.0-or-later via workspace.package

[bans]
# Deny duplicate versions of the same crate (bloat + audit surface). Exceptions need an ADR.
multiple-versions = "deny"
wildcards = "deny" # every dep pinned by version in workspace.dependencies (RULE-DEP-001)
highlight = "all"

[advisories]
# RUSTSEC advisories must be acted on: CI fails on any unmaintained/vulnerable dep.
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "deny"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
