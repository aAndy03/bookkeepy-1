# Bookkeepy 1 workspace — monorepo (ADR-0001). Crate layout + dependency direction: doc 03.
# Lints + dependency policy: docs 04/07. Governors: `cargo xtask govern` (doc 04 §4.11).
[workspace]
resolver = "3"
members = [
    "crates/ledger",
    "crates/shared",
    "crates/storage",
    "crates/build-info",
    "crates/i18n",
    "crates/profile",
    "crates/logging",
    "crates/diagnostics",
    "crates/bus",
    "crates/contracts",
    "crates/core",
    "crates/primary-data",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/aAndy03/bookkeepy-1"
authors = ["Andy <andymarin860@gmail.com>"]
# Distribution is GitHub Releases only (doc 08/09) — never crates.io. This also lets
# cargo-deny's allow-wildcard-paths accept our `workspace = true` inheritance.
publish = false

# Dependency policy (RULE-DEP-001, doc 07): latest versions, pinned centrally here;
# member crates use `dep.workspace = true`.
#
# M0 finding: cargo 1.100 warns on *unused* workspace.dependencies entries, so the full
# policy set lives in docs/07-dependencies.md and each entry is declared here on FIRST USE
# (keeps the build warning-free). Entries below are the ones in use.
[workspace.dependencies]
# Workspace-internal crates (path deps; direction rules enforced by `xtask govern deps`).
bookkeepy-core = { path = "crates/core" }
bookkeepy-primary-data = { path = "crates/primary-data" }
bookkeepy-build-info = { path = "crates/build-info" }
bookkeepy-contracts = { path = "crates/contracts" }
bookkeepy-bus = { path = "crates/bus" }
bookkeepy-profile = { path = "crates/profile" }
bookkeepy-logging = { path = "crates/logging" }
bookkeepy-diagnostics = { path = "crates/diagnostics" }
bookkeepy-shared = { path = "crates/shared" }
bookkeepy-ledger = { path = "crates/ledger" }
bookkeepy-storage = { path = "crates/storage" }
# bookkeepy-i18n gets its path entry here on first use by another crate (cargo 1.100 warns
# on unused workspace deps).
# Foundation (in use now)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
jiff = { version = "1", features = ["serde"] }  # civil dates/times + IANA tzdb (primary data as a dependency)
# First used in M0.5 (profile registry + logging + diagnostics + benches)
directories = "6"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Storage stack, first used in M1 (ADR-0005)
rusqlite = { version = "0.43", features = ["bundled", "blob", "backup"] }
sha2 = "0.11"   # audit hash chain (doc 05 §5.5)
hex = "0.4"     # hex-encode chain hashes
fs2 = "0.4"     # single-instance lockfile (ADR-0016)
# Testing / benches (doc 09)
proptest = "1"
criterion = "0.8"

# Declared on first use (full policy set with rationale: docs/07-dependencies.md):
#   gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }   (M3, ADR-0007)
#   tantivy = "0.27"                                                (M5, ADR-0006)
#   anyhow, csv, encoding_rs,
#   roxmltree, semver, iana-time-zone, sysinfo, os_info, opener, printpdf, insta
#   — see doc 07 for versions/rationale
#   ureq = { version = "3", default-features = false, features = ["rustls","gzip"] }
#     ONLY for the updater/rates crates (RULE-NET-001, ADR-0011; enforced by `govern net`)

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# RULE-ERR-002: no unwrap/expect outside tests (tests allow them via cfg_attr in lib.rs).
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
# INV-MONEY-001: money crates deny float arithmetic at the crate level (core does; UI geometry excepted).
float_arithmetic = "allow"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1 # smaller/slightly faster release binaries (round-4 item 9)
